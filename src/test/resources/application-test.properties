# Test profile: an in-memory H2 database in MySQL-compatibility mode.
# NON_KEYWORDS lets us keep table/column names that H2 would otherwise reserve.
spring.datasource.url=jdbc:h2:mem:shopsmart;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Build the schema from the entities for each test run, then drop it.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Do not run data.sql/shopsmart.sql during tests.
spring.sql.init.mode=never
