# ShopSmart Kenya - Production Database

spring.datasource.url=jdbc:mysql://${TIDB_HOST}:4000/shopsmart_kenya?sslMode=VERIFY_IDENTITY
spring.datasource.username=${TIDB_USERNAME}
spring.datasource.password=${TIDB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false