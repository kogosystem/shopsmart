<!DOCTYPE html>
<!-- Reusable <head>. Pages include it with:
     <head th:replace="~{fragments/head :: head('Page Title')}"></head> -->
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'ShopSmart Kenya | ' + ${title}">ShopSmart Kenya</title>

    <!-- Bootstrap 5 + icons from CDN (needs internet during the demo). -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
    <!-- Our own styles. th:href=@{...} makes the path work whatever the context root. -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body></body>
</html>
