<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="ss-footer mt-5 py-4">
    <div class="container">
        <div class="row gy-3">
            <div class="col-md-5">
                <h5 class="fw-bold"><i class="bi bi-bag-check-fill"></i> ShopSmart Kenya</h5>
                <p class="small mb-0">A student e-commerce platform demonstrating a personalised
                    product recommendation engine driven by real shopping behaviour.</p>
            </div>
            <div class="col-md-4">
                <h6 class="fw-bold">Shop</h6>
                <a class="d-block small" th:href="@{/products}">All products</a>
                <a class="d-block small" th:href="@{/products(sort='priceLow')}">Lowest price</a>
                <a class="d-block small" th:href="@{/recommendations}">Recommended for you</a>
            </div>
            <div class="col-md-3">
                <h6 class="fw-bold">Prices</h6>
                <p class="small mb-0">All prices are in Kenyan Shillings (KSh).</p>
            </div>
        </div>
        <hr class="border-light">
        <p class="text-center small mb-0">&copy; 2026 ShopSmart Kenya &mdash; academic prototype.</p>
    </div>
    <!-- Bootstrap JS (dropdowns, collapse) and our small script. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</footer>
</body>
</html>
