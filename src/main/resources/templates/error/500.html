<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container text-center my-5">
    <h1 class="display-4 fw-bold text-warning">Something went wrong</h1>
    <p class="fs-5" th:text="${message} ?: 'Please try again in a moment.'">Error.</p>
    <a th:href="@{/}" class="btn btn-ss mt-2">Back to home</a>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
