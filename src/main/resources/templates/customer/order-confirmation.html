<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Order confirmed')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container my-5" style="max-width:720px;">
    <div class="card border-0 shadow-sm text-center">
        <div class="card-body p-5">
            <i class="bi bi-check-circle-fill text-success" style="font-size:3.5rem;"></i>
            <h3 class="fw-bold mt-3">Thank you! Your order is confirmed.</h3>
            <p class="text-muted">Order <strong th:text="'#' + ${order.id}">#1</strong> placed on
                <span th:text="${#temporals.format(order.orderDate,'dd MMM yyyy, HH:mm')}">date</span>.</p>

            <div class="row text-start mt-4">
                <div class="col-sm-6">
                    <h6 class="fw-bold">Delivery to</h6>
                    <p class="mb-0" th:text="${order.deliveryName}">Name</p>
                    <p class="mb-0" th:text="${order.deliveryPhone}">Phone</p>
                    <p class="mb-0" th:text="${order.deliveryAddress} + ', ' + ${order.deliveryCity}">Address</p>
                </div>
                <div class="col-sm-6">
                    <h6 class="fw-bold">Payment</h6>
                    <p class="mb-0" th:text="${order.paymentMethod}">Method</p>
                    <p class="mb-0">Status: <span th:text="${order.paymentStatus}">PENDING</span></p>
                    <p class="mb-0">Order status: <span class="badge bg-secondary" th:text="${order.status}">PENDING</span></p>
                </div>
            </div>

            <div class="d-flex justify-content-between fs-5 fw-bold mt-4">
                <span>Total paid/payable</span>
                <span th:text="'KSh ' + ${#numbers.formatDecimal(order.totalAmount,1,'COMMA',2,'POINT')}">KSh</span>
            </div>

            <div class="mt-4">
                <a th:href="@{/orders}" class="btn btn-outline-success">View my orders</a>
                <a th:href="@{/recommendations}" class="btn btn-ss ms-2">See recommendations</a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
