<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Products')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/messages :: messages}"></div>

<div class="container my-4">
    <div class="row">
        <!-- Filters -->
        <div class="col-lg-3 mb-3">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h6 class="fw-bold">Filter &amp; sort</h6>
                    <form th:action="@{/products}" method="get">
                        <input type="hidden" name="keyword" th:value="${keyword}">
                        <label class="form-label small mt-2">Category</label>
                        <select class="form-select form-select-sm" name="categoryId" onchange="this.form.submit()">
                            <option value="">All categories</option>
                            <option th:each="c : ${navCategories}" th:value="${c.id}"
                                    th:text="${c.name}" th:selected="${selectedCategory == c.id}">Cat</option>
                        </select>
                        <label class="form-label small mt-3">Sort by</label>
                        <select class="form-select form-select-sm" name="sort" onchange="this.form.submit()">
                            <option value="newest"    th:selected="${sort=='newest'}">Newest</option>
                            <option value="priceLow"  th:selected="${sort=='priceLow'}">Price: low to high</option>
                            <option value="priceHigh" th:selected="${sort=='priceHigh'}">Price: high to low</option>
                            <option value="name"      th:selected="${sort=='name'}">Name A-Z</option>
                        </select>
                    </form>
                </div>
            </div>
        </div>

        <!-- Results -->
        <div class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0">
    <span th:if="${keyword}"
          th:text="|Results for &quot;${keyword}&quot;|">
        Results
    </span>

                    <span th:unless="${keyword}">
        All products
    </span>
                </h5>
                </h5>
                <span class="text-muted small" th:text="${products.totalElements} + ' items'">0 items</span>
            </div>

            <div class="row g-3">
                <div class="col-6 col-md-4" th:each="p : ${products.content}">
                    <div th:replace="~{fragments/cards :: product(${p})}"></div>
                </div>
            </div>
            <p th:if="${products.isEmpty()}" class="text-muted mt-4">
                No products match your search. Try a different keyword or category.</p>

            <!-- Pagination -->
            <nav th:if="${products.totalPages > 1}" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                        th:classappend="${i == products.number} ? 'active'">
                        <a class="page-link"
                           th:href="@{/products(keyword=${keyword},categoryId=${selectedCategory},sort=${sort},page=${i})}"
                           th:text="${i + 1}">1</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
