<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('My feedback')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/messages :: messages}"></div>

<div class="container my-4">
    <h3 class="fw-bold mb-3"><i class="bi bi-chat-heart"></i> My feedback</h3>
    <p class="text-muted">The likes and dislikes you give on recommendations shape your future picks.</p>

    <div th:if="${feedbackList.isEmpty()}" class="alert alert-info">
        You have not left any feedback yet. Visit your
        <a th:href="@{/recommendations}">recommendations</a> and use the like / dislike buttons.
    </div>

    <div class="card border-0 shadow-sm" th:if="${!feedbackList.isEmpty()}">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Product</th><th>Feedback</th><th>Comment</th><th>Date</th></tr></thead>
                <tbody>
                    <tr th:each="f : ${feedbackList}">
                        <td><a th:href="@{'/products/' + ${f.product.id}}"
                               th:text="${f.product.name}" class="text-decoration-none">Product</a></td>
                        <td>
                            <span th:if="${f.type.name() == 'LIKE'}" class="badge bg-success">
                                <i class="bi bi-hand-thumbs-up"></i> Like</span>
                            <span th:if="${f.type.name() == 'DISLIKE'}" class="badge bg-danger">
                                <i class="bi bi-hand-thumbs-down"></i> Dislike</span>
                        </td>
                        <td th:text="${f.comments}">comment</td>
                        <td th:text="${#temporals.format(f.feedbackDate,'dd MMM yyyy')}">date</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
