<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('My orders')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/messages :: messages}"></div>

<div class="container my-4">
    <h3 class="fw-bold mb-3">My orders &amp; purchase history</h3>

    <div th:if="${orders.isEmpty()}" class="alert alert-info">
        You have not placed any orders yet. <a th:href="@{/products}">Start shopping</a>.
    </div>

    <div class="card border-0 shadow-sm" th:if="${!orders.isEmpty()}">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Order</th><th>Date</th><th>Items</th><th>Total</th>
                    <th>Payment</th><th>Status</th><th></th></tr></thead>
                <tbody>
                    <tr th:each="o : ${orders}">
                        <td th:text="'#' + ${o.id}">#1</td>
                        <td th:text="${#temporals.format(o.orderDate,'dd MMM yyyy')}">date</td>
                        <td th:text="${o.items.size()}">0</td>
                        <td th:text="'KSh ' + ${#numbers.formatDecimal(o.totalAmount,1,'COMMA',2,'POINT')}">KSh</td>
                        <td th:text="${o.paymentMethod}">COD</td>
                        <td><span class="badge bg-secondary" th:text="${o.status}">PENDING</span></td>
                        <td><a th:href="@{'/orders/' + ${o.id}}" class="btn btn-sm btn-outline-secondary">View</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
