<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Order details')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container my-4">
    <a th:href="@{/orders}" class="btn btn-sm btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left"></i> Back to orders</a>
    <h3 class="fw-bold">Order <span th:text="'#' + ${order.id}">#1</span></h3>
    <p class="text-muted">Placed <span th:text="${#temporals.format(order.orderDate,'dd MMM yyyy, HH:mm')}">date</span>
        &mdash; status <span class="badge bg-secondary" th:text="${order.status}">PENDING</span></p>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Product</th><th>Unit price</th><th>Qty</th><th>Line total</th></tr></thead>
                <tbody>
                    <tr th:each="item : ${order.items}">
                        <td th:text="${item.productName}">Product</td>
                        <td th:text="'KSh ' + ${#numbers.formatDecimal(item.unitPrice,1,'COMMA',2,'POINT')}">KSh</td>
                        <td th:text="${item.quantity}">1</td>
                        <td th:text="'KSh ' + ${#numbers.formatDecimal(item.lineTotal,1,'COMMA',2,'POINT')}">KSh</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr class="fw-bold"><td colspan="3" class="text-end">Total</td>
                        <td th:text="'KSh ' + ${#numbers.formatDecimal(order.totalAmount,1,'COMMA',2,'POINT')}">KSh</td></tr>
                </tfoot>
            </table>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-6">
            <h6 class="fw-bold">Delivery</h6>
            <p class="mb-0" th:text="${order.deliveryName}">Name</p>
            <p class="mb-0" th:text="${order.deliveryPhone}">Phone</p>
            <p class="mb-0" th:text="${order.deliveryAddress} + ', ' + ${order.deliveryCity}">Address</p>
        </div>
        <div class="col-md-6">
            <h6 class="fw-bold">Payment</h6>
            <p class="mb-0" th:text="${order.paymentMethod} + ' - ' + ${order.paymentStatus}">Method</p>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
