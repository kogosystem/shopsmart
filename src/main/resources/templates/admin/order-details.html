<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Order detail')}"></head>
<body>
<div class="ss-admin-wrap">
    <div th:replace="~{fragments/admin-sidebar :: sidebar('orders')}"></div>
    <div class="ss-admin-content">
        <a th:href="@{/admin/orders}" class="btn btn-sm btn-outline-secondary mb-3">
            <i class="bi bi-arrow-left"></i> Back</a>
        <h3 class="fw-bold">Order <span th:text="'#' + ${order.id}">#1</span></h3>
        <p class="text-muted">
            <span th:text="${order.customer.fullName}">Name</span> &mdash;
            <span th:text="${#temporals.format(order.orderDate,'dd MMM yyyy, HH:mm')}">date</span></p>

        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead><tr><th>Product</th><th>Unit price</th><th>Qty</th><th>Line total</th></tr></thead>
                    <tbody>
                        <tr th:each="item : ${order.items}">
                            <td th:text="${item.productName}">Product</td>
                            <td th:text="'KSh ' + ${#numbers.formatDecimal(item.unitPrice,1,'COMMA',2,'POINT')}">KSh</td>
                            <td th:text="${item.quantity}">1</td>
                            <td th:text="'KSh ' + ${#numbers.formatDecimal(item.lineTotal,1,'COMMA',2,'POINT')}">KSh</td>
                        </tr>
                    </tbody>
                    <tfoot><tr class="fw-bold"><td colspan="3" class="text-end">Total</td>
                        <td th:text="'KSh ' + ${#numbers.formatDecimal(order.totalAmount,1,'COMMA',2,'POINT')}">KSh</td></tr></tfoot>
                </table>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-6">
                <h6 class="fw-bold">Delivery</h6>
                <p class="mb-0" th:text="${order.deliveryName}">Name</p>
                <p class="mb-0" th:text="${order.deliveryPhone}">Phone</p>
                <p class="mb-0" th:text="${order.deliveryAddress} + ', ' + ${order.deliveryCity}">Address</p>
            </div>
            <div class="col-md-6">
                <h6 class="fw-bold">Update status</h6>
                <form th:action="@{'/admin/orders/' + ${order.id} + '/status'}" method="post" class="d-flex gap-2">
                    <select name="status" class="form-select" style="width:180px;">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                th:selected="${s == order.status}">S</option>
                    </select>
                    <button class="btn btn-ss">Save</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
