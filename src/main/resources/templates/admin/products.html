<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Manage products')}"></head>
<body>
<div class="ss-admin-wrap">
    <div th:replace="~{fragments/admin-sidebar :: sidebar('products')}"></div>
    <div class="ss-admin-content">
        <div class="d-flex justify-content-between align-items-center">
            <h3 class="fw-bold mb-0">Products</h3>
            <a th:href="@{/admin/products/new}" class="btn btn-ss"><i class="bi bi-plus-lg"></i> Add product</a>
        </div>
        <div th:replace="~{fragments/messages :: messages}"></div>

        <div class="card border-0 shadow-sm mt-3">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead><tr><th>#</th><th>Name</th><th>Category</th><th>Price</th>
                        <th>Stock</th><th>Active</th><th></th></tr></thead>
                    <tbody>
                        <tr th:each="p : ${products}">
                            <td th:text="${p.id}">1</td>
                            <td th:text="${p.name}">Name</td>
                            <td th:text="${p.category.name}">Cat</td>
                            <td th:text="'KSh ' + ${#numbers.formatDecimal(p.price,1,'COMMA',2,'POINT')}">KSh</td>
                            <td th:text="${p.stock}">0</td>
                            <td>
                                <span th:if="${p.active}" class="badge bg-success">Active</span>
                                <span th:unless="${p.active}" class="badge bg-secondary">Hidden</span>
                            </td>
                            <td class="text-nowrap">
                                <a th:href="@{'/admin/products/edit/' + ${p.id}}" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-pencil"></i></a>
                                <form th:action="@{'/admin/products/delete/' + ${p.id}}" method="post" class="d-inline"
                                      onsubmit="return confirm('Remove this product? It will be hidden if it appears in past orders.');">
                                    <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
