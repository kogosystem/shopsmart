<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Feedback')}"></head>
<body>
<div class="ss-admin-wrap">
    <div th:replace="~{fragments/admin-sidebar :: sidebar('feedback')}"></div>
    <div class="ss-admin-content">
        <h3 class="fw-bold">Customer feedback</h3>
        <div class="row g-3 mt-1 mb-3">
            <div class="col-6 col-md-3"><div class="ss-stat g1"><div class="n" th:text="${likes}">0</div><div class="l">Likes</div></div></div>
            <div class="col-6 col-md-3"><div class="ss-stat g5"><div class="n" th:text="${dislikes}">0</div><div class="l">Dislikes</div></div></div>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead><tr><th>Customer</th><th>Product</th><th>Type</th>
                        <th>Comment</th><th>Run</th><th>Date</th></tr></thead>
                    <tbody>
                        <tr th:each="f : ${feedbackPage.content}">
                            <td th:text="${f.customer.fullName}">Name</td>
                            <td th:text="${f.product.name}">Product</td>
                            <td>
                                <span th:if="${f.type.name() == 'LIKE'}" class="badge bg-success">Like</span>
                                <span th:if="${f.type.name() == 'DISLIKE'}" class="badge bg-danger">Dislike</span>
                            </td>
                            <td th:text="${f.comments}">comment</td>
                            <td th:text="${f.run != null} ? ('#' + ${f.run.id}) : '-'">-</td>
                            <td th:text="${#temporals.format(f.feedbackDate,'dd MMM yyyy')}">date</td>
                        </tr>
                        <tr th:if="${feedbackPage.isEmpty()}"><td colspan="6" class="text-muted">No feedback yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
