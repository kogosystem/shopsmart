<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Product form')}"></head>
<body>
<div class="ss-admin-wrap">
    <div th:replace="~{fragments/admin-sidebar :: sidebar('products')}"></div>
    <div class="ss-admin-content">
        <h3 class="fw-bold" th:text="${productForm.id == null} ? 'Add product' : 'Edit product'">Product</h3>

        <div class="card border-0 shadow-sm mt-3" style="max-width:720px;">
            <div class="card-body">
                <form th:action="@{/admin/products/save}" method="post" th:object="${productForm}">
                    <input type="hidden" th:field="*{id}">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input class="form-control" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Price (KSh)</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{price}"
                                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{price}"></div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Stock</label>
                            <input type="number" class="form-control" th:field="*{stock}"
                                   th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{stock}"></div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" th:field="*{categoryId}"
                                    th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'">
                                <option value="">Choose...</option>
                                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Cat</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{categoryId}"></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Image file name
                            <span class="text-muted small">(in static/images/products/, e.g. laptop.jpg)</span></label>
                        <input class="form-control" th:field="*{imageUrl}" placeholder="placeholder.png">
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" th:field="*{active}" id="active">
                        <label class="form-check-label" for="active">Active (visible in the store)</label>
                    </div>
                    <button type="submit" class="btn btn-ss">Save</button>
                    <a th:href="@{/admin/products}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
