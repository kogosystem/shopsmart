<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Manage categories')}"></head>
<body>
<div class="ss-admin-wrap">
    <div th:replace="~{fragments/admin-sidebar :: sidebar('categories')}"></div>
    <div class="ss-admin-content">
        <h3 class="fw-bold">Categories</h3>
        <div th:replace="~{fragments/messages :: messages}"></div>

        <div class="row g-4 mt-1">
            <div class="col-lg-5">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="fw-bold" th:text="${categoryForm.id == null} ? 'Add category' : 'Edit category'">Add</h6>
                        <form th:action="@{/admin/categories/save}" method="post" th:object="${categoryForm}">
                            <input type="hidden" th:field="*{id}">
                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input class="form-control" th:field="*{name}"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{name}"></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea class="form-control" rows="2" th:field="*{description}"></textarea>
                            </div>
                            <div class="form-check mb-3">
                                <input type="checkbox" class="form-check-input" th:field="*{active}" id="cactive">
                                <label class="form-check-label" for="cactive">Active</label>
                            </div>
                            <button class="btn btn-ss">Save</button>
                            <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">Clear</a>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="card border-0 shadow-sm">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead><tr><th>#</th><th>Name</th><th>Active</th><th></th></tr></thead>
                            <tbody>
                                <tr th:each="c : ${categories}">
                                    <td th:text="${c.id}">1</td>
                                    <td><strong th:text="${c.name}">Name</strong>
                                        <div class="small text-muted" th:text="${c.description}">desc</div></td>
                                    <td>
                                        <span th:if="${c.active}" class="badge bg-success">Active</span>
                                        <span th:unless="${c.active}" class="badge bg-secondary">Hidden</span>
                                    </td>
                                    <td class="text-nowrap">
                                        <a th:href="@{'/admin/categories/edit/' + ${c.id}}" class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-pencil"></i></a>
                                        <form th:action="@{'/admin/categories/delete/' + ${c.id}}" method="post" class="d-inline"
                                              onsubmit="return confirm('Remove this category? It will be hidden if it still has products.');">
                                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
