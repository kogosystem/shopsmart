<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Recommendation log')}"></head>
<body>
<div class="ss-admin-wrap">
    <div th:replace="~{fragments/admin-sidebar :: sidebar('recommendations')}"></div>
    <div class="ss-admin-content">
        <h3 class="fw-bold">Recommendation runs</h3>
        <p class="text-muted">Every time the engine runs for a customer it is logged here.</p>
        <div class="card border-0 shadow-sm mt-2">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead><tr><th>Run #</th><th>Customer</th><th>Generated</th>
                        <th>Algorithm</th><th>Items</th><th></th></tr></thead>
                    <tbody>
                        <tr th:each="run : ${runs.content}">
                            <td th:text="${run.id}">1</td>
                            <td th:text="${run.customer.fullName}">Name</td>
                            <td th:text="${#temporals.format(run.generatedAt,'dd MMM yyyy, HH:mm')}">date</td>
                            <td><code th:text="${run.algorithmVersion}">v1</code></td>
                            <td th:text="${run.items.size()}">0</td>
                            <td><a th:href="@{'/admin/recommendations/' + ${run.id}}"
                                   class="btn btn-sm btn-outline-success">Inspect</a></td>
                        </tr>
                        <tr th:if="${runs.isEmpty()}"><td colspan="6" class="text-muted">No runs yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
