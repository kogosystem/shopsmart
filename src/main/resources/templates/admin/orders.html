<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Manage orders')}"></head>
<body>
<div class="ss-admin-wrap">
    <div th:replace="~{fragments/admin-sidebar :: sidebar('orders')}"></div>
    <div class="ss-admin-content">
        <h3 class="fw-bold">Orders</h3>
        <div th:replace="~{fragments/messages :: messages}"></div>
        <div class="card border-0 shadow-sm mt-2">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead><tr><th>#</th><th>Customer</th><th>Date</th><th>Total</th>
                        <th>Payment</th><th>Pay status</th><th>Update status</th></tr></thead>
                    <tbody>
                        <tr th:each="o : ${orders.content}">
                            <td><a th:href="@{'/admin/orders/' + ${o.id}}" th:text="'#' + ${o.id}">#1</a></td>
                            <td th:text="${o.customer.fullName}">Name</td>
                            <td th:text="${#temporals.format(o.orderDate,'dd MMM yyyy')}">date</td>
                            <td th:text="'KSh ' + ${#numbers.formatDecimal(o.totalAmount,1,'COMMA',2,'POINT')}">KSh</td>
                            <td th:text="${o.paymentMethod}">COD</td>
                            <td th:text="${o.paymentStatus}">PENDING</td>
                            <td>
                                <!-- Each row has its own tiny status form. -->
                                <form th:action="@{'/admin/orders/' + ${o.id} + '/status'}" method="post"
                                      class="d-flex gap-1">
                                    <select name="status" class="form-select form-select-sm" style="width:140px;">
                                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                                th:selected="${s == o.status}">S</option>
                                    </select>
                                    <button class="btn btn-sm btn-ss">Set</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${orders.isEmpty()}"><td colspan="7" class="text-muted">No orders yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
