<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Customers')}"></head>
<body>
<div class="ss-admin-wrap">
    <div th:replace="~{fragments/admin-sidebar :: sidebar('customers')}"></div>
    <div class="ss-admin-content">
        <h3 class="fw-bold">Customers</h3>
        <div th:replace="~{fragments/messages :: messages}"></div>
        <div class="card border-0 shadow-sm mt-2">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Phone</th>
                        <th>City</th><th>Joined</th><th></th></tr></thead>
                    <tbody>
                        <tr th:each="c : ${customers}">
                            <td th:text="${c.id}">1</td>
                            <td th:text="${c.fullName}">Name</td>
                            <td th:text="${c.email}">email</td>
                            <td th:text="${c.phone}">phone</td>
                            <td th:text="${c.city}">city</td>
                            <td th:text="${#temporals.format(c.createdAt,'dd MMM yyyy')}">date</td>
                            <td><a th:href="@{'/admin/customers/' + ${c.id}}" class="btn btn-sm btn-outline-secondary">
                                History</a></td>
                        </tr>
                        <tr th:if="${customers.isEmpty()}"><td colspan="7" class="text-muted">No customers yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
