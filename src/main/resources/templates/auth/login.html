<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container my-5" style="max-width:460px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h3 class="fw-bold text-center mb-4"><i class="bi bi-box-arrow-in-right text-success"></i> Welcome back</h3>

            <!-- Spring Security sends ?error on bad login and ?logout after logout. -->
            <div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div>
            <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <!-- Posts to /login, handled by Spring Security (not a controller). -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="username" class="form-control" required autofocus
                           placeholder="you@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-ss w-100">Login</button>
            </form>
            <p class="text-center mt-3 mb-0 small">
                No account? <a th:href="@{/register}">Register here</a></p>
        </div>
    </div>
    <p class="text-center text-muted small mt-3">
<!--        Admin demo: admin@shopsmart.co.ke / Admin@123</p>-->
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
