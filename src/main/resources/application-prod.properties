# ShopSmart Kenya - TiDB Cloud Production Database

spring.datasource.url=jdbc:mysql://${TIDB_HOST}:4000/shopsmart_kenya?sslMode=VERIFY_IDENTITY
spring.datasource.username=${TIDB_USERNAME}
spring.datasource.password=${TIDB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# HikariCP connection pool settings
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=30000